[workspace]
resolver = "2"
members = ["crates/decode-core", "crates/decode-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
vte = { version = "0.15", features = ["ansi"] }
unicode-width = "0.2"
# 钉死 wasm-bindgen 版本，与本地 `wasm-bindgen-cli` 0.2.127 严格对齐——bindgen 格式要求
# 二者 schema 版本一致，caret "0.2" 会被 cargo 解析到 0.2.128 而与 CLI 脱节（见 #7 诊断）。
wasm-bindgen = "=0.2.127"

# WASM 目标吞吐：跨 crate 内联（vte 解析器 + decode-core 的 hot loop）只在 LTO + 单 codegen
# unit 下才跨 crate 边界内联，否则 native 119 → WASM 的折更狠（见 #7 吞吐诊断）。
[profile.release]
lto = true
codegen-units = 1
